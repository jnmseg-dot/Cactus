<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Cactus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
        }

        .calendar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .calendar {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
            overflow: hidden;
            border: 2px solid black;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
        }

        .header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
            padding: 0 10px;
        }

        .header button:hover {
            color: #000;
        }

        .month-year {
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            gap: 10px;
            text-transform: uppercase;
        }
        
        .month-year select {
            font-size: 1em;
            font-weight: bold;
            border: none;
            background: transparent;
            cursor: pointer;
            text-transform: uppercase;
            appearance: none;
            text-align: center;
            outline: none;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #555;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
