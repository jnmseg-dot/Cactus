<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Cactus</title><link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <!-- ESCUDO ANTI-ERRORES -->
    <script>window.onerror=function(m,u,l){document.body.innerHTML=`<div style="padding:20px;text-align:center"><div style="background:#ffe6e6;color:#cc0000;border:3px solid #cc0000;padding:20px;border-radius:10px"><h2>🚨 ERROR EN LÍNEA ${l} 🚨</h2><p>${m}</p></div></div>`;};</script>
    <style>
        body{font-family:'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;background:#f0f0f0;padding:20px;box-sizing:border-box}
        .profile-btn{position:fixed;top:20px;right:20px;background:#fff;border:2px solid #000;border-radius:8px;padding:10px 18px;font-weight:bold;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,0.1);z-index:100}
        .profile-btn:hover{background:#e9ecef}
        .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);justify-content:center;align-items:center;z-index:200}
        .modal-overlay.active{display:flex}
        .profile-modal{background:#fff;border:2px solid #000;border-radius:8px;padding:25px;width:320px;display:flex;flex-direction:column;gap:15px;box-sizing:border-box}
        .profile-modal h3{margin:0;border-bottom:2px solid #000;padding-bottom:10px;text-align:center;text-transform:uppercase}
        .profile-group{display:flex;flex-direction:column;gap:6px}
        .profile-group label{font-weight:bold;font-size:0.95em}
        .profile-group select,.profile-group input{padding:8px;font-size:1em;border-radius:6px;border:2px solid #000;font-weight:bold;outline:none}
        .close-modal-btn{margin-top:10px;padding:10px;background:#000;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
        .main-container{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;margin-bottom:20px}
        .calendar{background:#fff;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.1);width:350px;border:2px solid #000;overflow:hidden}
        .header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#f8f9fa;border-bottom:2px solid #000}
        .header button{background:none;border:none;font-size:20px;font-weight:bold;cursor:pointer}
        .month-year select{font-size:1.1em;font-weight:bold;border:none;background:transparent;cursor:pointer;text-transform:uppercase;outline:none;appearance:none;text-align:center}
        .days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:bold;background:#f8f9fa;border-bottom:2px solid #000;font-size:0.8em}
        .days div{padding:10px 0;border-right:1px solid #ccc}
        .dates{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:60px;border-left:2px solid #000}
        .date{display:flex;justify-content:center;align-items:center;border-right:1px solid #000;border-bottom:1px solid #000;box-sizing:border-box;color:#000;cursor:pointer;position:relative;overflow:hidden}
        .date.inactive{background:#f9f9f9;color:#aaa;cursor:default}
        .day-number{display:flex;justify-content:center;align-items:center;width:28px;height:28px;border-radius:50%}
        .festivo{background:purple;color:#fff;font-weight:bold}
        .date.has-label{flex-direction:column;justify-content:flex-start;padding:2px}
        .date.has-label .day-number{align-self:flex-start;width:18px;height:18px;font-size:0.7em;position:absolute;top:2px;left:2px;z-index:2}
        .custom-label{font-size:0.75em;font-weight:bold;text-align:center;margin-top:14px;line-height:1.1;z-index:1;width:100%}
        .legend{margin-top:25px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
        .legend-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
        .legend-controls select{padding:8px 12px;font-size:0.95em;border-radius:8px;border:2px solid #000;font-weight:bold;width:250px;cursor:pointer;outline:none}
        .input-group-container{display:none;flex-direction:column;gap:12px;background:#fff;padding:15px;border:2px solid #000;border-radius:8px;width:280px}
        .input-group{display:flex;justify-content:space-between;align-items:center}
        .input-group label{font-weight:bold;font-size:0.9em}
        .input-group input{border:1px solid #ccc;border-radius:4px;padding:5px;font-weight:bold;outline:none}
        .stats-panel{background:#fff;border-radius:8px;border:2px solid #000;padding:20px;width:220px;height:fit-content;box-shadow:0 4px 8px rgba(0,0,0,0.1)}
        .stats-panel h3{margin-top:0;border-bottom:2px solid #000;padding-bottom:10px;text-align:center}
        .stats-panel p{display:flex;justify-content:space-between;font-weight:bold;margin:15px 0;border-bottom:1px dashed #ccc;padding-bottom:5px}
        .version-text{font-size:0.9em;color:#777;font-weight:bold;margin-top:20px;text-align:center}

        /* COLORES */
        .date.guardia{background:#ff4d4d!important;color:#fff}
        .date.ref-ob{background:#ff6347!important;color:#fff}
        .date.ref-vol{background:#ffa500!important;color:#000}
        .date.ref-vol-horas{background:#ffcc80!important;color:#000}
        .date.eventos{background:#add8e6!important;color:#000}
        .date.cambio-guardia, .date.devolucion-guardia{background:#d2b48c!important;color:#000}
        .date.superior{background:#9370db!important;color:#fff}
        
        /* DEGRADADO PERMISOS VERDES */
        .date.vacaciones{background:#1b5e20!important;color:#fff} /* Verde muy oscuro */
        .date.moscosos{background:#2e8b57!important;color:#fff} /* Verde oscuro */
        .date.compensatorio{background:#3cb371!important;color:#000} /* Verde medio */
        .date.vac-ant-horas{background:#90ee90!important;color:#000} /* Verde claro */
        .date.otros-horas{background:#c1ffc1!important;color:#000} /* Verde muy claro */
    </style>
</head>
<body>
    <button id="profileBtn" class="profile-btn">Perfil</button>
    <div id="profileModalOverlay" class="modal-overlay">
        <div class="profile-modal">
            <h3>Perfil</h3>
            <div class="profile-group"><label>Turno:</label><select id="perfilTurno"><option value="" hidden>Selecciona turno</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></div>
            <div class="profile-group"><label>Categoría:</label><select id="perfilCategoria"><option value="bombero">Bombero</option><option value="jefe-dotacion">Jefe de dotación ▲▲</option><option value="jefe-turno">Jefe de Turno ▲▲▲</option></select></div>
            <div class="profile-group"><label>Fecha de ingreso:</label><input type="date" id="perfilFechaIngreso"></div>
            <button id="closeProfileBtn" class="close-modal-btn">Guardar y cerrar</button>
        </div>
    </div>

    <div class="main-container">
        <div class="calendar-section">
            <div class="calendar">
                <div class="header"><button id="prevBtn">&lt;</button><div class="month-year"><span id="month"></span> <select id="yearSelect"></select></div><button id="nextBtn">&gt;</button></div>
                <div class="days"><div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div></div>
                <div class="dates" id="dates"></div>
            </div>
            <div class="legend">
                <div class="legend-controls">
                    <select id="tipoGuardiaSelect">
                        <option value="" hidden>&nbsp;&nbsp;Guardias extras:</option>
                        <option value="ref-ob" style="color:#ff6347;">● Refuerzo obligatorio</option>
                        <option value="ref-vol" style="color:#ffa500;">● Refuerzo voluntario</option>
                        <option value="ref-vol-horas" style="color:#ffcc80;">● Refuerzo voluntario (Horas)</option>
                        <option value="eventos" style="color:#add8e6;">● Eventos (Horas)</option>
                        <option value="cambio-guardia" style="color:#d2b48c;">● Cambio de guardia</option>
                        <option value="superior" style="color:#9370db;">● Superior Categoría</option>
                        <option value="borrar">⚪ Borrar</option>
                    </select>
                    <select id="permisosSelect">
                        <option value="" hidden>&nbsp;&nbsp;Permisos:</option>
                        <option value="vacaciones" id="optVac" style="color:#1b5e20;">● Vacaciones</option>
                        <option value="moscosos" id="optMos" style="color:#2e8b57;">● Moscosos</option>
                        <option value="compensatorio" id="optCon" style="color:#3cb371;">● Compensatorio</option>
                        <option value="devolucion-guardia" style="color:#d2b48c;">● Devolución de Guardia</option>
                        <option value="vac-ant-horas" style="color:#90ee90;">● Vac. por antigüedad (Horas)</option>
                        <option value="otros-horas" style="color:#c1ffc1;">● Otros (Horas)</option>
                        <option value="borrar">⚪ Borrar</option>
                    </select>
                </div>
                <div id="timeInputs" class="input-group-container">
                    <div class="input-group"><label>Hora inicio:</label><input type="time" id="horaInicio"></div>
                    <div class="input-group"><label>Hora fin:</label><input type="time" id="horaFin"></div>
                </div>
                <div id="nameInputGroup" class="input-group-container">
                    <div class="input-group"><label id="labelGuardiaNombre">Le haces la guardia a:</label><input type="text" id="guardiaNombre" placeholder="Nombre..." style="width:110px;"></div>
                </div>
            </div>
        </div>
        <div class="stats-panel">
            <h3>Cómputo Mensual</h3>
            <p>Solapes: <span id="countSolapes">0</span></p>
            <p>Nocturnos: <span id="countNocturnos">0</span></p>
            <p>Festivos: <span id="countFestivos">0</span></p>
        </div>
    </div>
    <div class="version-text">Versión 3.9 - Cactus Compacto</div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const els = {
            yS: document.getElementById('yearSelect'), mS: document.getElementById('month'),
            dC: document.getElementById('dates'), pB: document.getElementById('prevBtn'), nB: document.getElementById('nextBtn'),
            tG: document.getElementById('tipoGuardiaSelect'), pS: document.getElementById('permisosSelect'),
            tI: document.getElementById('timeInputs'), hI: document.getElementById('horaInicio'), hF: document.getElementById('horaFin'),
            nI: document.getElementById('nameInputGroup'), lN: document.getElementById('labelGuardiaNombre'), gN: document.getElementById('guardiaNombre'),
            cS: document.getElementById('countSolapes'), cN: document.getElementById('countNocturnos'), cF: document.getElementById('countFestivos'),
            prB: document.getElementById('profileBtn'), prO: document.getElementById('profileModalOverlay'), prC: document.getElementById('closeProfileBtn')
        };
        const mN = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        const LBL = {'ref-ob':'Obl','ref-vol':'Vol','ref-vol-horas':'Vol','eventos':'Evet','cambio-guardia':'Camb','vacaciones':'Vac','moscosos':'Mos','compensatorio':'Con','devolucion-guardia':'Devl','vac-ant-horas':'Vac Ant','otros-horas':'Otr'};
        const FES = [{m:0,d:1},{m:0,d:6},{m:1,d:17},{m:3,d:2},{m:3,d:3},{m:4,d:1},{m:5,d:29},{m:7,d:15},{m:8,d:8},{m:9,d:12},{m:10,d:2},{m:11,d:7},{m:11,d:8},{m:11,d:25}];
        
        let cD=new Date(), cM=cD.getMonth(), cY=cD.getFullYear(), cC=null, pTurno=null, pFecha=null, pDays={}, mapT={};

        // INICIALIZAR TURNOS
        let d = new Date(2024,0,1,12,0,0), eD = new Date(2035,11,31,12,0,0), tArr=[0,5,1,2,0,3,4,5,0,1,2,3], f={};
        let tShift = 2; // Ajuste matemático directo para que el 14/10/2026 sea turno 1
        while(d<=eD) {
            let y=d.getFullYear(), m=d.getMonth(), dt=d.getDate(), aff = tArr[y-2024];
            if(m===2 && aff>0 && tShift===aff && !f[y]) { f[y]=true; tShift=(tShift%5)+1; }
            mapT[`${y}-${m}-${dt}`] = tShift;
            tShift=(tShift%5)+1; d.setDate(d.getDate()+1);
        }

        const isF = (y,m,d) => { let dw=new Date(y,m,d).getDay(); return dw===0||dw===6||FES.some(x=>x.m===m&&x.d===d); };
        const t2m = (t,e) => { if(!t)return 0; let [h,m]=t.split(':').map(Number), ms=h*60+m; return (e&&ms<=540)||(!e&&ms<540)?ms+1440:ms; };

        // PERMISOS Y ESTADÍSTICAS
        function getPerm(y, tb, mx) {
            let cp=0, cq=0, cr=0;
            for(let k in pDays) {
                let v=pDays[k].split('|'), t=v[0]==='split'?v[3]:v[0];
                if(t===tb) {
                    if(k.startsWith(`${y-1}-`)) cp++;
                    else if(k.startsWith(`${y}-`)) parseInt(k.split('-')[1])<3 ? cq++ : cr++;
                }
            }
            let lp=Math.max(0,mx-cp), cl=Math.min(lp,cq);
            return { rL: lp-cl, rN: Math.max(0, mx-(cq-cl)-cr) };
        }
        function checkPerm(t,k) {
            let m=parseInt(k.split('-')[1]), y=parseInt(k.split('-')[0]), mx=t==='vacaciones'?7:(t==='moscosos'?2:3);
            let s=getPerm(y,t,mx); return m<3 ? (s.rL>0||s.rN>0) : s.rN>0;
        }

        function render() {
            let v=getPerm(cY,'vacaciones',7), m=getPerm(cY,'moscosos',2), c=getPerm(cY,'compensatorio',3);
            document.getElementById('optVac').textContent = `● Vacaciones (${cM<3&&v.rL>0?v.rL+'+'+v.rN:v.rN})`;
            document.getElementById('optMos').textContent = `● Moscosos (${cM<3&&m.rL>0?m.rL+'+'+m.rN:m.rN})`;
            document.getElementById('optCon').textContent = `● Compensatorio (${cM<3&&c.rL>0?c.rL+'+'+c.rN:c.rN})`;

            els.mS.textContent = mN[cM]; els.yS.value = cY; els.dC.innerHTML = '';
            let fD=new Date(cY,cM,1).getDay(), sD=fD===0?6:fD-1, lD=new Date(cY,cM+1,0).getDate(), plD=new Date(cY,cM,0).getDate();
            let pM=cM-1, pY=cY; if(pM<0){pM=11;pY--;}
            let nM=cM+1, nY=cY; if(nM>11){nM=0;nY++;}
            
            for(let i=sD;i>0;i--) els.dC.appendChild(cCell(pY,pM,plD-i+1,true));
            for(let i=1;i<=lD;i++) els.dC.appendChild(cCell(cY,cM,i,false));
            let eDays = new Date(cY,cM,lD).getDay(); eDays = eDays===0?0:7-eDays;
            for(let i=1;i<=eDays;i++) els.dC.appendChild(cCell(nY,nM,i,true));

            let sol=0, noc=0, fes=0;
            for(let d=1; d<=lD; d++) {
                let k=`${cY}-${cM}-${d}`, t=null, p=null;
                if(pDays[k]){ p=pDays[k].split('|'); t=p[0]; }
                else if(pTurno&&mapT[k]===pTurno&&(!pFecha||new Date(cY,cM,d)>=pFecha)) t='guardia';
                if(!t) continue;

                let if0=isF(cY,cM,d), if1=isF(cY,cM,d+1), dw=new Date(cY,cM,d).getDay();
                if(['guardia','ref-ob','ref-vol','cambio-guardia'].includes(t)) {
                    sol++; noc++; fes+=(if0?(dw===6?1.5:(if1?2:1)):(if1?0.5:0));
                } else if(['vacaciones','moscosos','compensatorio','split'].includes(t)) {
                    noc++; fes+=(if0?(dw===6?1.5:(if1?2:1)):(if1?0.5:0));
                } else if(['ref-vol-horas','eventos'].includes(t)) {
                    if(t==='ref-vol-horas') sol++;
                    let mI=t2m(p[1],0), mF=t2m(p[2],1);
                    if(mF>1620) noc++; else if(mF>1320) noc+=0.5;
                    let t1=Math.max(0,Math.min(mF,1440)-Math.max(mI,540)); if(t1>0&&if0) fes+=(t1<=300?0.5:1);
                    let t2=Math.max(0,Math.min(mF,1980)-Math.max(mI,1440)); if(t2>0&&if1) fes+=(t2<=300?0.5:1);
                } else if(['vac-ant-horas','otros-horas'].includes(t)) {
                    sol++; let mI=t2m(p[1],0), mF=t2m(p[2],1);
                    let w1=900-Math.max(0,Math.min(mF,1440)-Math.max(mI,540)); if(w1>0&&if0) fes+=(w1<=300?0.5:1);
                    let w2=540-Math.max(0,Math.min(mF,1980)-Math.max(mI,1440)); if(w2>0&&if1) fes+=(w2<=300?0.5:1);
                    let n1=300-Math.max(0,Math.min(mF,1620)-Math.max(mI,1320));
                    let n2=360-Math.max(0,Math.min(mF,1980)-Math.max(mI,1620));
                    if(n2>0) noc++; else if(n1>0) noc+=0.5;
                }
            }
            els.cS.textContent=sol; els.cN.textContent=noc; els.cF.textContent=fes;
        }

        function cCell(y,m,d,ina) {
            let div=document.createElement('div'), k=`${y}-${m}-${d}`;
            div.className='date'+(ina?' inactive':''); div.dataset.k=k;
            let sp=document.createElement('span'); sp.className='day-number'+(isF(y,m,d)?' festivo':''); sp.textContent=d; div.appendChild(sp);
            
            let v=pDays[k];
            if(v) {
                let p=v.split('|'), t=p[0];
                if(t==='split') {
                    let c1=p[1]==='ref-ob'?'#ff6347':'#d2b48c', c2=p[3]==='moscosos'?'#2e8b57':'#3cb371';
                    div.style.background=`linear-gradient(to bottom, ${c1} 50%, ${c2} 50%)`; div.classList.add('has-label');
                    let l1=p[1]==='ref-ob'?'Obl':`Camb<br><span style="font-size:0.85em">${p[2]}</span>`,
