<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Cactus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calendar {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
            overflow: hidden;
            border: 2px solid black;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
        }

        .header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
            padding: 0 10px;
        }

        .header button:hover {
            color: #000;
        }

        .month-year {
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            gap: 10px;
            text-transform: uppercase;
        }
        
        .month-year select {
            font-size: 1em;
            font-weight: bold;
            border: none;
            background: transparent;
            cursor: pointer;
            text-transform: uppercase;
            appearance: none;
            text-align: center;
            outline: none;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #555;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
            font-size: 0.8em;
        }

        .days div {
            padding: 10px 0;
            border-right: 1px solid #ccc;
        }
        .days div:last-child {
            border-right: none;
        }

        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(50px, auto);
            border-left: 2px solid black;
        }

        .date {
            padding: 5px;
            text-align: right;
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            box-sizing: border-box;
            color: #000;
        }
        
        .date:nth-child(7n) {
            border-right: none;
        }

        .date.inactive {
            color: #aaa;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="calendar">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <div class="month-year">
                <span id="month"></span>
                <select id="yearSelect"></select>
            </div>
            <button id="nextBtn">&gt;</button>
        </div>
        <div class="days">
            <div>LUN</div>
            <div>MAR</div>
            <div>MIÉ</div>
            <div>JUE</div>
            <div>VIE</div>
            <div>SÁB</div>
            <div>DOM</div>
        </div>
        <div class="dates" id="dates"></div>
    </div>

    <!-- AQUÍ EMPIEZA LA MAGIA DEL CALENDARIO. ¡Asegúrate de copiar esto! -->
    <script>
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const yearSelect = document.getElementById('yearSelect');
        const monthSpan = document.getElementById('month');
        const datesContainer = document.getElementById('dates');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        function initYearSelect() {
            for (let y = 2024; y <= 2035; y++) {
                let option = document.createElement('option');
                option.value = y;
                option.text = y;
                yearSelect.appendChild(option);
            }
            yearSelect.value = currentYear;
            
            yearSelect.addEventListener('change', () => {
                currentYear = parseInt(yearSelect.value);
                renderCalendar();
            });
        }

        function renderCalendar() {
            monthSpan.textContent = monthNames[currentMonth];
            yearSelect.value = currentYear; 

            datesContainer.innerHTML = ''; 

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 

            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();
            const lastDayIndex = new Date(currentYear, currentMonth, lastDate).getDay();
            let endDays = lastDayIndex === 0 ? 0 : 7 - lastDayIndex;

            for (let i = startDay; i > 0; i--) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date', 'inactive');
                dateDiv.textContent = prevLastDate - i + 1;
                datesContainer.appendChild(dateDiv);
            }

            for (let i = 1; i <= lastDate; i++) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date');
                dateDiv.textContent = i;
                datesContainer.appendChild(dateDiv);
            }

            for (let i = 1; i <= endDays; i++) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date', 'inactive');
                dateDiv.textContent = i;
                datesContainer.appendChild(dateDiv);
            }
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
                if(currentYear < 2024) currentYear = 2024;
            }
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
                if(currentYear > 2035) currentYear = 2035;
            }
            renderCalendar();
        });

        initYearSelect();
        renderCalendar();
    </script>
</body>
</html>
