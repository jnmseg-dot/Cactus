<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Cactus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calendar {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
            overflow: hidden;
            border: 2px solid black;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
        }

        .header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #333;
            padding: 0 10px;
        }

        .header button:hover {
            color: #000;
        }

        .month-year {
            font-size: 1.2em;
            font-weight: bold;
            display: flex;
            gap: 10px;
            text-transform: uppercase;
        }
        
        .month-year select {
            font-size: 1em;
            font-weight: bold;
            border: none;
            background: transparent;
            cursor: pointer;
            text-transform: uppercase;
            appearance: none;
            text-align: center;
            outline: none;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #555;
            background-color: #f8f9fa;
            border-bottom: 2px solid black;
            font-size: 0.8em;
        }

        .days div {
            padding: 10px 0;
            border-right: 1px solid #ccc;
        }
        .days div:last-child {
            border-right: none;
        }

        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(50px, auto);
            border-left: 2px solid black;
        }

        .date {
            padding: 5px;
            text-align: right;
            border-right: 1px solid black;
            border-bottom: 1px solid black;
            box-sizing: border-box;
            color: #000;
            cursor: pointer; /* Añadimos el cursor de la mano */
            transition: background-color 0.2s;
        }
        
        .date:nth-child(7n) {
            border-right: none;
        }

        .date.inactive {
            color: #aaa;
            background-color: #f9f9f9;
            cursor: default;
        }

        /* --- ZONA DE BOTONES Y COLORES --- */
        .legend {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 350px;
        }

        .legend button {
            padding: 8px 12px;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8em;
            transition: 0.2s;
            color: #000;
        }

        /* Botón seleccionado (borde negro grueso) */
        .legend button.active {
            border-color: #000;
            box-shadow: 0 0 5px rgba(0,0,0,0.4);
            transform: scale(1.05);
        }

        /* Colores de los botones */
        .btn-guardia { background-color: #ff4d4d; color: white; }
        .btn-ref-ob { background-color: #ffa07a; }
        .btn-ref-vol { background-color: #90ee90; }
        .btn-eventos { background-color: #add8e6; }
        .btn-otros { background-color: #ffffe0; }

        /* Colores aplicados a los días del calendario */
        .date.guardia { background-color: #ff4d4d; color: white; }
        .date.ref-ob { background-color: #ffa07a; }
        .date.ref-vol { background-color: #90ee90; }
        .date.eventos { background-color: #add8e6; }
        .date.otros { background-color: #ffffe0; }

    </style>
</head>
<body>

    <div class="calendar">
        <div class="header">
            <button id="prevBtn">&lt;</button>
            <div class="month-year">
                <span id="month"></span>
                <select id="yearSelect"></select>
            </div>
            <button id="nextBtn">&gt;</button>
        </div>
        <div class="days">
            <div>LUN</div>
            <div>MAR</div>
            <div>MIÉ</div>
            <div>JUE</div>
            <div>VIE</div>
            <div>SÁB</div>
            <div>DOM</div>
        </div>
        <div class="dates" id="dates"></div>
    </div>

    <!-- Botones para pintar -->
    <div class="legend">
        <button class="btn-guardia" data-color="guardia">Guardia</button>
        <button class="btn-ref-ob" data-color="ref-ob">Refuerzo obligatorio</button>
        <button class="btn-ref-vol" data-color="ref-vol">Refuerzo voluntario</button>
        <button class="btn-eventos" data-color="eventos">Eventos</button>
        <button class="btn-otros" data-color="otros">Otros</button>
    </div>

    <script>
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const yearSelect = document.getElementById('yearSelect');
        const monthSpan = document.getElementById('month');
        const datesContainer = document.getElementById('dates');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const legendBtns = document.querySelectorAll('.legend button');

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();

        // Variables para la herramienta de pintura
        let currentColor = null;
        const paintedDays = {}; // Aquí guardaremos los días pintados: { "2026-10-15": "guardia" }

        // Configurar los botones de colores
        legendBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Si el botón ya estaba activo, lo desactivamos
                if (btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    currentColor = null;
                } else {
                    // Quitamos la clase 'active' de todos los botones y se la ponemos al que hemos hecho clic
                    legendBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentColor = btn.getAttribute('data-color'); // Obtenemos qué color pintar
                }
            });
        });

        // Configurar el click en los días del calendario
        datesContainer.addEventListener('click', (e) => {
            // Solo actuar si hacemos clic en un día del mes actual y tenemos un color seleccionado
            if (e.target.classList.contains('date') && !e.target.classList.contains('inactive')) {
                if (!currentColor) return; // Si no hay botón seleccionado, no hace nada

                const dayNumber = e.target.textContent;
                const dateKey = `${currentYear}-${currentMonth}-${dayNumber}`; // Clave única para guardar el día

                // Si el día ya tiene el color que intentamos pintar, lo borramos (efecto goma de borrar)
                if (e.target.classList.contains(currentColor)) {
                    e.target.classList.remove(currentColor);
                    delete paintedDays[dateKey];
                } else {
                    // Si tiene otros colores previos, los borramos primero
                    e.target.classList.remove('guardia', 'ref-ob', 'ref-vol', 'eventos', 'otros');
                    // Pintamos con el nuevo color
                    e.target.classList.add(currentColor);
                    // Guardamos en memoria que este día está pintado
                    paintedDays[dateKey] = currentColor;
                }
            }
        });

        function initYearSelect() {
            for (let y = 2024; y <= 2035; y++) {
                let option = document.createElement('option');
                option.value = y;
                option.text = y;
                yearSelect.appendChild(option);
            }
            yearSelect.value = currentYear;
            
            yearSelect.addEventListener('change', () => {
                currentYear = parseInt(yearSelect.value);
                renderCalendar();
            });
        }

        function renderCalendar() {
            monthSpan.textContent = monthNames[currentMonth];
            yearSelect.value = currentYear; 

            datesContainer.innerHTML = ''; 

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            let startDay = firstDayIndex === 0 ? 6 : firstDayIndex - 1; 

            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();
            const lastDayIndex = new Date(currentYear, currentMonth, lastDate).getDay();
            let endDays = lastDayIndex === 0 ? 0 : 7 - lastDayIndex;

            // Días del mes anterior (inactivos)
            for (let i = startDay; i > 0; i--) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date', 'inactive');
                dateDiv.textContent = prevLastDate - i + 1;
                datesContainer.appendChild(dateDiv);
            }

            // Días del mes actual
            for (let i = 1; i <= lastDate; i++) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date');
                dateDiv.textContent = i;
                
                // Comprobamos si este día lo habíamos pintado antes
                const dateKey = `${currentYear}-${currentMonth}-${i}`;
                if (paintedDays[dateKey]) {
                    dateDiv.classList.add(paintedDays[dateKey]);
                }
                
                datesContainer.appendChild(dateDiv);
            }

            // Días del mes siguiente (inactivos)
            for (let i = 1; i <= endDays; i++) {
                const dateDiv = document.createElement('div');
                dateDiv.classList.add('date', 'inactive');
                dateDiv.textContent = i;
                datesContainer.appendChild(dateDiv);
            }
        }

        prevBtn.addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
                if(currentYear < 2024) currentYear = 2024;
            }
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
                if(currentYear > 2035) currentYear = 2035;
            }
            renderCalendar();
        });

        initYearSelect();
        renderCalendar();
    </script>
</body>
</html>
